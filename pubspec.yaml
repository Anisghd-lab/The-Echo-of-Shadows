name: the_echo_of_shadows
description: "L'Écho des Ombres (The Echo of Shadows) — 2.5D Isometric Psychological Thriller Game built with Flutter & Flame."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.21.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - new assets/
    - new assets/data/
    - new assets/data/maps/
    - new assets/Alex walk/
    - new assets/Alex run/
    - new assets/Alex interaction/
    - new assets/Alex idle/
    - new assets/Alex portraits/
    - new assets/TELEPHONE PRPOS/
    - new assets/characters/alex/
    - new assets/characters/emma/
    - new assets/characters/ethan/
    - new assets/characters/officer_james/
    - new assets/characters/old_michael/
    - new assets/environments/village/
    - new assets/environments/family_house/
    - new assets/environments/bunker/
    - new assets/props/interactive/
    - new assets/props/narrative/
    - new assets/nature/
    - new assets/PERSONNAGES/
    - "new assets/PERSONNAGES/Alex — Personnage principal/"
    - new assets/PERSONNAGES/Emma/
    - "new assets/PERSONNAGES/Ethan — Frère d’Alex/"
    - new assets/PERSONNAGES/Officer James/
    - new assets/PERSONNAGES/Old Michael/
    - new assets/VILLAGE ENVIRONMENT/
    - new assets/MAISON FAMILLIALE/
    - new assets/INTERIORS BUNKER/
    - new assets/NARRATIVE PROPS FURNITURE/
    - new assets/NATURE GAMEPLAY STRUCTURES/
