    - assets/images/characters/emma/
    - assets/images/characters/ethan/
    - assets/images/characters/james/
    - assets/images/characters/michael/
    - assets/images/environments/village/buildings/
    - assets/images/environments/village/decor/
    - assets/images/environments/village/map_tiles/
    - assets/images/environments/family_house/exterior/
    - assets/images/environments/family_house/bedroom/
    - assets/images/environments/bunker/exterior/
    - assets/images/environments/bunker/interior/
