name: the_echo_of_shadows
description: "L'Écho des Ombres (The Echo of Shadows) — 2.5D Isometric Psychological Thriller Game built with Flutter & Flame."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.21.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/maps/
    - assets/images/characters/alex/
    - assets/images/characters/emma/
    - assets/images/characters/ethan/
    - assets/images/characters/officer_james/
    - assets/images/characters/old_michael/
    - assets/images/environments/village/
    - assets/images/environments/family_house/
    - assets/images/environments/bunker/
    - assets/images/props/interactive/
    - assets/images/props/narrative/
    - assets/images/nature/
